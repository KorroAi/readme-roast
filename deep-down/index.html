<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05080c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>DEEP DOWN</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script>
      // ES5 on purpose: runs even where the game bundle cannot parse (WebView older than Chromium 80).
      (function () {
        var ok = true;
        try {
          new Function('var a = null; return a?.b ?? 1;')();
        } catch (e) {
          ok = false;
        }
        // Newest platform features the build relies on: CSS inset (Chromium 87), replaceChildren (86).
        ok = ok && !!(window.CSS && CSS.supports && CSS.supports('inset', '0')) && 'replaceChildren' in Element.prototype;
        if (ok) return;
        var el = document.createElement('div');
        el.className = 'fatal';
        el.setAttribute('role', 'alert');
        el.textContent = '%DD_WEBVIEW_OUTDATED%';
        document.body.appendChild(el);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

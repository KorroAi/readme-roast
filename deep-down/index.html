<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070a0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>DEEP DOWN</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
    <style>
      /* The boot mark: the emblem, painted before any script runs; its flame breathes (2.4 s).
         The UI's first screen is drawn over it (#ui is z-index 2), then it is removed. */
      #dd-boot { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; pointer-events: none; background: radial-gradient(circle at 50% 50%, rgba(216, 114, 42, 0.14), transparent 30vmin), #070a0f; }
      #dd-boot svg { width: 112px; height: auto; overflow: visible; }
      .dd-boot-core { transform-box: fill-box; transform-origin: 50% 100%; animation: dd-breathe 2.4s ease-in-out infinite; }
      @keyframes dd-breathe { 50% { opacity: 0.5; transform: scale(0.9); } }
      @media (prefers-reduced-motion: reduce) { .dd-boot-core { animation: none; } }
    </style>
  </head>
  <body>
    <div id="dd-boot" aria-hidden="true">%DD_BOOT_MARK%</div>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script>
      // ES5 on purpose: runs even where the game bundle cannot parse (WebView older than Chromium 80).
      (function () {
        var ok = true;
        try {
          new Function('var a = null; return a?.b ?? 1;')();
        } catch (e) {
          ok = false;
        }
        // Newest platform features the build relies on: the :where()/:is() selectors of the brand plates
        // (Chromium 88; 87 drops those rules and leaves unreadable native buttons), CSS inset (87) and
        // replaceChildren (86). CSS.supports('selector(...)') itself exists from Chromium 83.
        ok = ok && !!(window.CSS && CSS.supports && CSS.supports('inset', '0') && CSS.supports('selector(:where(a))') && CSS.supports('selector(:is(a))')) && 'replaceChildren' in Element.prototype;
        if (ok) return;
        // Where the bundle still parses (a missing feature, not syntax), it must not boot under the message.
        window.__DD_UNSUPPORTED__ = true;
        var el = document.createElement('div');
        el.className = 'fatal';
        el.setAttribute('role', 'alert');
        el.textContent = '%DD_WEBVIEW_OUTDATED%';
        document.body.appendChild(el);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

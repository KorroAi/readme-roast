<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  /* Layout: one quiet column, one big word at a time. Three modes in a single switch at the top. */
  --bg:#F6F9F8; --card:#FFFFFF; --ink:#10282E; --muted:#61777C; --line:#E2EBE9;
  --accent:#0C8C86; --on-accent:#FFFFFF; --soft:#E4F3F1;
  --eta:#D4475E; --good:#18865A; --good-soft:#E3F4EB; --bad:#C3443E; --bad-soft:#FBE9E7;
  --shadow:0 1px 2px rgba(16,40,46,.05),0 12px 32px rgba(16,40,46,.07);
  --serif:"Young Serif",Georgia,"Times New Roman",serif;
  --sans:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1618; --card:#112227; --ink:#E8F3F1; --muted:#93ACAF; --line:#203539;
    --accent:#3CC4B9; --on-accent:#05282A; --soft:#14343A;
    --eta:#FF7D8E; --good:#4CCB8C; --good-soft:#123528; --bad:#FF8079; --bad-soft:#3A1C1C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1618; --card:#112227; --ink:#E8F3F1; --muted:#93ACAF; --line:#203539;
  --accent:#3CC4B9; --on-accent:#05282A; --soft:#14343A;
  --eta:#FF7D8E; --good:#4CCB8C; --good-soft:#123528; --bad:#FF8079; --bad-soft:#3A1C1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:22px;padding-block:18px calc(32px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-direction:column;gap:14px;padding-block:6px 4px}
h1{margin:0;font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.1}
h1 span{color:var(--muted);font-family:var(--sans);font-size:15px;font-weight:700;margin-left:6px}
.switch{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:999px;background:var(--line)}
.switch button{min-height:44px;border:0;border-radius:999px;background:transparent;font-weight:800;font-size:16px;color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

.ty{font-family:var(--serif);font-weight:400}
.eta{color:var(--eta)}
.pron{font-style:italic;font-weight:600;color:var(--muted)}

/* Apprendre */
.themes{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 4px}
.themes::-webkit-scrollbar{display:none}
.themes button{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-weight:800;font-size:15px;color:var(--muted);white-space:nowrap}
.themes button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.card{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:34px 22px 26px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-height:340px;justify-content:center;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card .em{font-size:60px;line-height:1.1;margin-bottom:6px}
.card .word{font-size:clamp(40px,12vw,58px);line-height:1.05;overflow-wrap:anywhere}
.card .pron{font-size:18px}
.card .fr{font-size:22px;font-weight:800;margin-top:8px}
.card .tip{font-size:15px;color:var(--muted);max-width:32ch;margin-top:10px;line-height:1.45}
.nav{display:grid;grid-template-columns:56px 1fr 56px;gap:12px;align-items:center}
.round{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center}
.round svg,.btn svg{width:22px;height:22px}
.btn{min-height:56px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);font-weight:900;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 22px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn[disabled]{opacity:.5}
.count{text-align:center;color:var(--muted);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.hint{text-align:center;color:var(--muted);font-size:14.5px;line-height:1.6}
.hint b{font-family:var(--serif);font-weight:400;color:var(--ink)}

/* Jouer */
.progress{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.ask{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:18px 0 4px}
.ask .q{color:var(--muted);font-weight:700}
.ask .word{font-size:clamp(40px,12vw,56px);line-height:1.05;overflow-wrap:anywhere}
.answers{display:flex;flex-direction:column;gap:10px}
.answer{display:flex;align-items:center;gap:14px;min-height:68px;padding:10px 18px;border-radius:20px;border:2px solid var(--line);background:var(--card);text-align:left;font-weight:800;font-size:18px;line-height:1.25}
.answer .em{font-size:32px;width:40px;text-align:center;flex:none}
.answer.ok{border-color:var(--good);background:var(--good-soft)}
.answer.ko{border-color:var(--bad);background:var(--bad-soft)}
.answer[disabled]{cursor:default}
.answer[disabled]:not(.ok):not(.ko){opacity:.45}
.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 0 10px}
.result .score{font-family:var(--serif);font-size:84px;line-height:1}
.result p{color:var(--muted);font-weight:700;margin:0}

/* Chercher */
.field{width:100%;min-height:58px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);padding:0 18px;font-size:18px}
.field:focus{outline:none;border-color:var(--accent)}
.list{display:flex;flex-direction:column;background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
.row .em{font-size:28px;width:36px;text-align:center;flex:none}
.row .t{flex:1;min-width:0}
.row .t .ty{display:block;font-size:22px;line-height:1.2;overflow-wrap:anywhere}
.row .t small{display:block;color:var(--muted);font-weight:700;font-size:15px}
.row .sp{color:var(--accent);flex:none}
.row .sp svg{width:22px;height:22px}
.claude{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:6px}
.claude .ty{font-size:30px;line-height:1.15;overflow-wrap:anywhere}
.claude .fr{font-weight:800}
.note{color:var(--muted);font-size:14px;line-height:1.45;text-align:center}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.fade,.spin{animation:none}.bar i{transition:none}}
</style>

</div>

const voice = {
  ok: typeof speechSynthesis !== 'undefined' && typeof SpeechSynthesisUtterance !== 'undefined', v: null,
  init() {

  say(text, pron) {
    if (!this.ok || !text) return;

/* ---------- Jouer : 10 questions, 3 réponses */
function newGame() {
  const pool = shuffle(WORDS.filter(w => w.lv <= 2));
  const picked = [];
  for (const w of pool) { if (picked.length >= 10) break; if (!picked.some(p => norm(p.fr) === norm(w.fr))) picked.push(w); }
  S.game = { list: picked, n: 0, score: 0, choices: makeChoices(picked[0]), picked: null };
}
function makeChoices(w) {
  const others = shuffle(WORDS.filter(x => x.id !== w.id && x.lv <= 2 && norm(x.fr) !== norm(w.fr) && !norm(x.ty).includes(norm(w.ty)) && !norm(w.ty).includes(norm(x.ty))));
  const same = others.filter(x => x.th === w.th);
  const out = [];
  for (const x of same.concat(others)) { if (out.length >= 2) break; if (!out.includes(x) && (!emoji(x) || emoji(x) !== emoji(w))) out.push(x); }
  return shuffle([w].concat(out));
}

/* ---------- Chercher */
function search(q) {
  const n = norm(q); if (!n) return [];
  const scored = [];
  for (const w of WORDS) {
    const a = norm(w.fr), b = norm(w.ty); let s = 0;
    if (a === n || b === n) s = 100;
    else if (a.startsWith(n) || b.startsWith(n)) s = 70;
    else if (a.split(' ').some(t => t.startsWith(n)) || b.split(' ').some(t => t.startsWith(n))) s = 50;
    else if (n.length > 2 && (a.includes(n) || b.includes(n))) s = 30;
    if (s) scored.push([s, w]);
  }
  return scored.sort((x, y) => y[0] - x[0]).slice(0, 8).map(x => x[1]);
}

    const code = e && e.code;
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) S.sample = null;
    S.claude = { q, err: code === 'rate_limited' ? 'Trop de demandes d’un coup : réessayez dans un moment.' : code === 'cancelled' ? '' : 'La traduction n’a pas marché. Réessayez.' };
  }
  if (S.mode === 'find') $('#results').innerHTML = resultsHTML();
}

/* ---------- Rendu et gestes */
function render() {
  document.querySelectorAll('.switch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === S.mode)));
  $('#view').innerHTML = S.mode === 'learn' ? viewLearn() : S.mode === 'play' ? viewPlay() : viewFind();
}
function step(d) { const n = deck().length; S.i = (S.i + d + n) % n; render(); }
const byId = id => WORDS.find(w => w.id === id);

document.addEventListener('click', e => {
  const m = e.target.closest('[data-mode]');
  if (m) { S.mode = m.dataset.mode; render(); window.scrollTo(0, 0); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'theme') { S.theme = el.dataset.id; S.i = 0; render(); el.blur(); }
  else if (a === 'prev') step(-1);
  else if (a === 'next') step(1);
  else if (a === 'say') { const w = byId(el.dataset.id); if (w) voice.say(w.ty, w.pr); }
  else if (a === 'sayText') voice.say(el.dataset.text);
  else if (a === 'answer') { const g = S.game; if (g.picked !== null) return; g.picked = Number(el.dataset.i); if (g.choices[g.picked].id === g.list[g.n].id) g.score++; render(); }
  else if (a === 'nextq') { const g = S.game; g.n++; g.picked = null; if (g.n < g.list.length) g.choices = makeChoices(g.list[g.n]); render(); window.scrollTo(0, 0); }
  else if (a === 'replay') { newGame(); render(); }
  else if (a === 'translate') translate();
});
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; $('#results').innerHTML = resultsHTML(); } });
document.addEventListener('keydown', e => {
  if (S.mode !== 'learn' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1);
});
let sx = null;
document.addEventListener('pointerdown', e => { if (S.mode === 'learn' && e.target.closest('#card')) sx = e.clientX; });
document.addEventListener('pointerup', e => { if (sx === null) return; const d = e.clientX - sx; sx = null; if (Math.abs(d) > 50) step(d < 0 ? 1 : -1); });

voice.init();
render();
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('sample').then(s => { S.sample = s || null; if (S.mode === 'find') $('#results').innerHTML = resultsHTML(); }).catch(() => {});
}
</script>

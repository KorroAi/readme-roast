<title>Reo Tahiti en famille</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Apprendre le tahitien en famille : un lagon qui se remplit de poissons à chaque mot appris, des jeux coopératifs, un traducteur et des missions à vivre sur place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400..900;1,600..800&family=Young+Serif&display=swap">
<style>
:root{
  /* Layout: a pocket app. A living lagoon band on top, one 560px column, a frosted tab bar at the bottom; cards only for things you tap. */
  --bg:#EAF5F2; --bg-2:#DCEEE9; --surface:#FFFFFF; --surface-2:#F3FAF8;
  --ink:#0B2B33; --ink-2:#4B676D; --line:#CBE1DC;
  --lagoon:#0E9A95; --lagoon-2:#0A7680; --on-lagoon:#FFFFFF;
  --hibiscus:#D63A52; --on-hibiscus:#FFFFFF; --mango:#EC9F2B; --sand:#F6E8CC; --sand-ink:#6B4E1C;
  --good:#118A52; --bad:#C5303B; --on-sea:#FFFFFF;
  --sea-1:#9BEDE2; --sea-2:#2DB9B3; --sea-3:#0A6A84; --floor-1:#F2DDB0; --floor-2:#D6B97F;
  --sky-1:#BDEFF2; --sky-2:#FDE7C8; --isle:#2F6E5C; --isle-2:#3F8A6F; --hull:#6B3E22;
  --is-dark:0;
  --shadow:0 1px 2px rgba(11,43,51,.06),0 8px 24px rgba(11,43,51,.08);
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#04161C; --bg-2:#06202A; --surface:#0A2630; --surface-2:#0D2E39;
    --ink:#E2F3F0; --ink-2:#98B8BB; --line:#1A4350;
    --lagoon:#2BC6BB; --lagoon-2:#62DCD2; --on-lagoon:#03282C;
    --hibiscus:#FF6F80; --on-hibiscus:#2A0710; --mango:#FFBF5E; --sand:#2B281C; --sand-ink:#EBD5A5;
    --good:#46CF89; --bad:#FF7C82; --on-sea:#FFFFFF;
    --sea-1:#0F4D5D; --sea-2:#093343; --sea-3:#031A24; --floor-1:#2A3B3A; --floor-2:#1A292B;
    --sky-1:#0B2440; --sky-2:#2A4766; --isle:#0E2C28; --isle-2:#15403A; --hull:#8A5A38;
    --is-dark:1;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#04161C; --bg-2:#06202A; --surface:#0A2630; --surface-2:#0D2E39;
  --ink:#E2F3F0; --ink-2:#98B8BB; --line:#1A4350;
  --lagoon:#2BC6BB; --lagoon-2:#62DCD2; --on-lagoon:#03282C;
  --hibiscus:#FF6F80; --on-hibiscus:#2A0710; --mango:#FFBF5E; --sand:#2B281C; --sand-ink:#EBD5A5;
  --good:#46CF89; --bad:#FF7C82; --on-sea:#FFFFFF;
  --sea-1:#0F4D5D; --sea-2:#093343; --sea-3:#031A24; --floor-1:#2A3B3A; --floor-2:#1A292B;
  --sky-1:#0B2440; --sky-2:#2A4766; --isle:#0E2C28; --isle-2:#15403A; --hull:#8A5A38;
  --is-dark:1;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.4);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
p{margin:0}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ty{font-family:var(--f-display);font-weight:400;letter-spacing:.005em}
.eta{color:var(--hibiscus)}
.pron{font-style:italic;font-weight:700;color:var(--ink-2)}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--lagoon-2)}
.muted{color:var(--ink-2)}
.tip{font-size:14.5px;color:var(--ink-2);line-height:1.45}

/* app frame */
.app{max-width:560px;margin:0 auto;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1}
.brand b i{font-style:normal;color:var(--hibiscus)}
.brand small{font-size:11.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.top-r{display:flex;align-items:center;gap:8px}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:900;font-size:14px;color:var(--sand-ink);background:var(--sand);padding:6px 10px;border-radius:999px}
.streak svg{width:16px;height:16px}
.tribe-btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:4px 10px 4px 6px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:14px}
.tribe-btn .avstack{display:inline-flex;flex-direction:row}
.tribe-btn .avstack .av{margin-left:-8px}
.tribe-btn .avstack .av:first-child{margin-left:0}
.tribe-btn svg{width:18px;height:18px}
.av{--c:#11A39B;width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;font-size:19px;line-height:1;background:var(--surface);border:2.5px solid var(--c);flex:none}
.av.xs{width:30px;height:30px;font-size:16px;border-width:2px}
.av.lg{width:56px;height:56px;font-size:30px;border-width:3px}

/* hero lagoon */
.hero{position:relative;height:clamp(270px,46vh,380px);overflow:hidden;border-radius:0 0 30px 30px;background:linear-gradient(var(--sea-1),var(--sea-3))}
@media (min-width:600px){.hero{border-radius:30px;margin-inline:16px}}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
.hero-ui{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;gap:12px;padding-block:16px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--on-sea);background:linear-gradient(rgba(2,26,34,.34),rgba(2,26,34,0) 40%,rgba(2,26,34,0) 58%,rgba(2,26,34,.38))}
.hero-ui .eyebrow{color:var(--on-sea);opacity:.85}
.h-title{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.05;margin:2px 0 4px;text-shadow:0 2px 14px rgba(0,30,40,.35)}
.h-sub{font-weight:700;font-size:14.5px;max-width:30ch;text-shadow:0 1px 8px rgba(0,30,40,.45)}
.h-bot{display:flex;flex-direction:column;gap:8px}
.h-next{font-weight:800;font-size:14px;text-shadow:0 1px 8px rgba(0,30,40,.5)}
.h-stats{display:flex;gap:6px;flex-wrap:wrap}
.h-stats span{display:inline-flex;align-items:center;gap:5px;font-weight:900;font-size:13.5px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.28)}
.h-stats svg{width:15px;height:15px}
.h-cta{pointer-events:auto;align-self:flex-start}
.fish-tip{position:absolute;z-index:3;pointer-events:none;max-width:240px;background:var(--surface);color:var(--ink);border-radius:16px;padding:9px 13px;box-shadow:var(--shadow);font-size:13.5px;line-height:1.3;animation:pop .2s ease}
.fish-tip .ty{font-size:19px;display:block}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}

/* views */
.view{padding-block:20px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.sec-h h2{font-family:var(--f-display);font-weight:400;font-size:23px;line-height:1.15;margin:0}
.link{border:0;background:none;padding:6px 0;color:var(--lagoon-2);font-weight:900;font-size:14px;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.note{font-size:13.5px;color:var(--ink-2);line-height:1.45}
.banner{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:700;color:var(--sand-ink);background:var(--sand);border-radius:16px;padding:12px 14px}
.banner svg{flex:none;width:20px;height:20px;margin-top:1px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;border:1.5px solid transparent;background:var(--lagoon);color:var(--on-lagoon);font-weight:900;font-size:16px;text-decoration:none;transition:transform .12s ease,filter .2s;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px;flex:none}
.btn.alt{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.hib{background:var(--hibiscus);color:var(--on-hibiscus)}
.btn.ghost{background:transparent;color:var(--lagoon-2)}
.btn.sm{min-height:40px;padding:0 15px;font-size:14.5px}
.btn.block{width:100%}
.btn[disabled],.btn.is-off{opacity:.45;pointer-events:none}
.icon-btn{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);flex:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn.sm{width:38px;height:38px}
.icon-btn.sea{background:var(--lagoon);border-color:var(--lagoon);color:var(--on-lagoon)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.stack{display:flex;flex-direction:column;gap:14px}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:14.5px;white-space:nowrap;color:var(--ink);flex:none}
.chip small{font-weight:800;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.chip .av{width:28px;height:28px;font-size:15px;border-width:2px;margin-left:-8px}

/* pearls (mastery) */
.pearls{display:inline-flex;gap:4px;flex:none}
.pearl{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);display:block}
.pearl.on{border-color:transparent;background:radial-gradient(circle at 34% 30%,#fff 0 9%,#cbb9ea 15%,#5b5b80 36%,#20263a 66%,#0b0e16 100%);box-shadow:inset -1px -1px 2px rgba(0,0,0,.45)}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;color:inherit}
.li:first-child{border-top:0}
.li .txt{flex:1;min-width:0}
.li .txt .ty{font-size:19px;line-height:1.25;display:block;overflow-wrap:anywhere}
.li .txt .fr{font-size:14px;color:var(--ink-2);display:block;line-height:1.3}
.glyph{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:24px;line-height:1;background:var(--surface-2);color:var(--lagoon-2);font-family:var(--f-display)}
.glyph svg{width:28px;height:28px}
.fishmark{color:var(--lagoon-2);display:inline-grid}
.fishmark svg{width:18px;height:18px}

/* tapa band */
.tapa{height:12px;margin:-18px -18px 14px;border-radius:var(--r-lg) var(--r-lg) 0 0;background:conic-gradient(from 135deg at 50% 0,var(--hibiscus) 90deg,transparent 0) 0 0/18px 12px repeat-x,var(--sand)}

/* word of the day */
.wotd{position:relative;overflow:hidden}
.wotd-word{font-size:clamp(38px,11vw,52px);line-height:1.05;margin:4px 0 6px;overflow-wrap:anywhere}
.wotd-row{display:flex;align-items:center;gap:10px}
.wotd-fr{font-size:20px;font-weight:900;margin:8px 0 6px}
.wotd-act{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}

/* game tiles */
.games{display:grid;gap:12px}
.gtile{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;text-align:left;width:100%;padding:12px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);color:inherit}
.gtile .art{height:84px;border-radius:16px;overflow:hidden;background:var(--surface-2)}
.gtile .art svg{width:100%;height:100%;display:block}
.gtile h3{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.15;margin:0 0 2px}
.gtile p{font-size:14px;color:var(--ink-2);line-height:1.35}
.gtile .rec{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:900;color:var(--sand-ink);background:var(--sand);padding:3px 9px;border-radius:999px}

/* setup cards in Jouer */
.setup{display:flex;flex-direction:column;gap:12px}
.setup h3{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0}
.setup .art-wide{height:110px;margin:-18px -18px 2px;border-radius:var(--r-lg) var(--r-lg) 0 0;overflow:hidden}
.setup .art-wide svg{width:100%;height:100%;display:block}
.opt-label{font-size:12.5px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}

/* progress bar */
.bar{height:10px;border-radius:99px;background:var(--bg-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--lagoon),var(--mango))}

/* translator */
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:var(--bg-2);gap:4px}
.seg button{min-height:42px;border:0;border-radius:999px;background:transparent;font-weight:900;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.field{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:13px 15px;font-size:17px;line-height:1.4;resize:vertical;min-height:56px}
.field:focus{outline:none;border-color:var(--lagoon)}
input.field{min-height:50px;resize:none}
.tr-out{display:flex;flex-direction:column;gap:12px}
.res{display:flex;flex-direction:column;gap:10px}
.res .big{font-size:clamp(26px,7vw,34px);line-height:1.15;overflow-wrap:anywhere}
.res .fr-big{font-size:22px;font-weight:900;line-height:1.3}
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{display:inline-flex;flex-direction:column;padding:6px 10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);line-height:1.2}
.wchip b{font-family:var(--f-display);font-weight:400;font-size:16px}
.wchip span{font-size:12.5px;color:var(--ink-2);font-weight:700}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:900;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2)}
.badge.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.badge.warn{color:var(--sand-ink);background:var(--sand);border-color:transparent}
.badge svg{width:14px;height:14px}
.loader{display:flex;align-items:center;gap:12px;font-weight:800;color:var(--ink-2)}
.loader i{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--lagoon);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* missions */
.necklace{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:6px 0 2px}
.necklace svg{width:24px;height:24px}
.shell-off{color:var(--line)}
.shell-on{color:var(--mango)}
.mission{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface)}
.mission.done{background:color-mix(in srgb,var(--mango) 10%,var(--surface));border-color:color-mix(in srgb,var(--mango) 45%,var(--line))}
.mission h3{margin:0;font-size:17px;font-weight:900;line-height:1.3}
.mission .say{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mission .say .ty{font-size:21px}
.mission .who{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:800;color:var(--ink-2);flex-wrap:wrap}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(2,18,24,.48);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:28px 28px 0 0;padding-block:6px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 -12px 44px rgba(0,0,0,.28);animation:sheetIn .28s cubic-bezier(.2,.9,.3,1)}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:6px auto 0}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-h h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0}
@keyframes sheetIn{from{transform:translateY(48px);opacity:.3}to{transform:none;opacity:1}}
.ws{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.ws-glyph{font-size:56px;line-height:1}
.ws-glyph svg{width:64px;height:64px;color:var(--lagoon-2)}
.ws-word{font-size:clamp(34px,10vw,46px);line-height:1.08;overflow-wrap:anywhere}
.ws-fr{font-size:21px;font-weight:900}
.ws-m{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--ink-2)}
.ws-act{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:4px}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emoji-grid button{aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:22px;line-height:1;padding:0}
.emoji-grid button[aria-pressed="true"]{border-color:var(--lagoon);background:color-mix(in srgb,var(--lagoon) 16%,var(--surface))}
@media (max-width:380px){.emoji-grid{grid-template-columns:repeat(6,1fr)}}
.member-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.member-row:first-child{border-top:0}
.member-row .txt{flex:1;min-width:0}
.member-row b{display:block;font-size:17px}
.member-row small{color:var(--ink-2);font-weight:700}
.danger-zone{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* game overlay */
.game{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.game .in{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;padding-block:8px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.g-top{display:flex;align-items:center;gap:10px}

const Data = {
  db: null, ready: false, pending: [], q: new Map(), saveT: 0,
  async init() {
    let db = null, user = null;

      try { const r = await Promise.all([c.use('db'), c.use('user')]); db = r[0]; user = r[1]; } catch (e) { db = null; }
    }
    if (db) {
      this.db = db; S.mode = 'db';
      if (user) { try { const w = await user.can('data.write'); if (w === false) S.canWrite = false; } catch (e) { /* le serveur tranchera */ } }
      COLS.forEach(col => this.listen(col));
    } else {
      S.mode = 'local'; this.loadLocal(); COLS.forEach(col => { S.loaded[col] = true; });
    }
    this.ready = true; this.flush();
    Lagoon.sync(); scheduleRender();
  },
  listen(col) {
    try {
      this.db.collection(col).limit(1000).onSnapshot(snap => {
        const o = {};
        snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); });
        S[col] = o; S.loaded[col] = true;
        if (col === 'progress' || col === 'phrases') Lagoon.sync();
        if (col === 'missions') Lagoon.dirtyDecor();
        if (col === 'progress') checkRemoteFish(snap);
        scheduleRender();
      }, err => {
        if (err && err.code === 'revoked') { S.canWrite = false; scheduleRender(); }
      });
    } catch (e) { S.loaded[col] = true; }
  },
  set(col, id, data) {
    S[col] = Object.assign({}, S[col], { [id]: data });
    if (!this.ready) { this.pending.push(['set', col, id, data]); return Promise.resolve(); }
    return this.write('set', col, id, data);
  },
  del(col, id) {
    const o = Object.assign({}, S[col]); delete o[id]; S[col] = o;
    if (!this.ready) { this.pending.push(['del', col, id]); return Promise.resolve(); }
    return this.write('del', col, id);
  },
  write(op, col, id, data) {
    if (S.mode === 'local') { this.saveLocal(); return Promise.resolve(); }
    if (!S.canWrite || !this.db) return Promise.resolve();
    const path = col + '/' + id;
    const prev = this.q.get(path) || Promise.resolve();
    const next = prev.catch(() => {}).then(() => op === 'set' ? this.db.doc(path).set(data) : this.db.doc(path).delete()).catch(e => this.fail(e));

  },
  flush() { const p = this.pending; this.pending = []; p.forEach(([op, col, id, data]) => this.write(op, col, id, data)); },
  fail(e) {

    } else if (code === 'quota_exceeded') toast('Le carnet est plein : supprimez quelques phrases pour faire de la place.');
    else if (code === 'resource_exhausted') toast('Doucement, la tribu ! Trop d’enregistrements d’un coup.');

  },
  saveLocal() {
    clearTimeout(this.saveT);

  },
  loadLocal() {

    } catch (e) { /* rien à charger */ }
  }
};

const TTS = {
  ok: false, voice: null,
  init() {

    if (!this.ok) return;

  },

/* ================================================================ Rendering */
let renderQueued = false, viewPending = false, sheetPending = false;
function scheduleRender() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; renderAll(); }); }
function typingIn(el) { const a = document.activeElement; return !!(a && el && el.contains(a) && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')); }
function renderAll() {
  renderTop(); renderTabbar(); renderHeroUI();
  const view = $('#view');
  if (typingIn(view)) viewPending = true; else { viewPending = false; renderView(); }
  if (S.ui.sheet && S.ui.sheet.live) { if (typingIn($('#sheet'))) sheetPending = true; else { sheetPending = false; renderSheet(); } }
}
document.addEventListener('focusout', () => setTimeout(() => {

}, 60));

function matchesHTML() {
  const tr = S.ui.tr; const q = tr.text.trim();
  if (!q) return '';
  const res = searchLex(q, tr.dir);
  if (!res.length) return S.sample ? '' : `<p class="note">Pas dans notre lexique. Essayez un mot plus simple.</p>`;
  return `<div class="stack-sm"><span class="opt-label">Dans notre lexique</span><div class="list">${res.map(wordRow).join('')}</div></div>`;
}
function searchLex(q, dir) {
  const nq = norm(q); if (!nq) return [];
  const out = [];
  allWords().forEach(w => {
    const a = norm(dir === 'fr' ? w.fr : w.ty), b = norm(dir === 'fr' ? w.ty : w.fr);
    let s = 0;
    if (a === nq) s = 100; else if (a.startsWith(nq)) s = 70; else if (a.split(' ').some(t => t && t.startsWith(nq))) s = 55; else if (nq.length > 2 && a.includes(nq)) s = 40;
    else if (b === nq) s = 35; else if (nq.length > 2 && b.includes(nq)) s = 20;
    else if (nq.includes(' ') && a.length > 2 && nq.split(' ').some(t => t.length > 2 && a.split(' ').includes(t))) s = 15;
    if (s) out.push([s, w]);
  });
  return out.sort((x, y) => y[0] - x[0]).slice(0, 5).map(x => x[1]);
}
function certBadge(c) {
  if (c === 'haute') return `<span class="badge good">${ico('check')} Traduction sûre</span>`;
  if (c === 'faible') return `<span class="badge warn">${ico('info')} Incertaine : à faire vérifier</span>`;
  return `<span class="badge warn">${ico('info')} À faire vérifier</span>`;
}

/* ================================================================ Questions */
function poolFor(level, theme) {
  const maxLv = (LEVELS[level] || LEVELS.moyen).lv;
  const ok = w => w.lv <= maxLv && (level !== 'petit' || (w.e && !w.e.startsWith('svg:')));
  let base = allWords();

  if (l.length < 6) l = base.filter(ok);

}
function weightedPick(list, exclude) {
  const now = Date.now();

  let total = 0;
  const ws = src.map(w => { const p = S.progress[w.id] || {}; const m = p.m || 0; const ageH = p.last ? (now - p.last) / 36e5 : 48; let wt = (4 - m) * (1 + Math.min(ageH, 48) / 24); if (p.learnedAt && m >= 3) wt *= 0.3; total += wt; return wt; });
  let r = Math.random() * total;
  for (let i = 0; i < src.length; i++) { r -= ws[i]; if (r <= 0) return src[i]; }
  return src[src.length - 1];
}
function confusable(a, b) {

}

}
function syllables(word) {

}

}
function makeQuestion(level, theme, exclude) {

  types = types.filter(t => (t !== 'emoji2ty' && t !== 'ty2emoji') || hasEmoji);
  const tiles = buildTiles(w);

async function initSample() {

}

  if (dir === 'fr') return ctx + `Traduis en tahitien cette phrase française : « ${text} »\n\nRéponds uniquement avec un objet JSON, sans texte autour, de cette forme :\n{"tahitien":"…","prononciation":"…","mot_a_mot":[{"ty":"…","fr":"…"}],"retour":"…","note":"…","certitude":"haute"}\n\nRègles :\n- "tahitien" : la formulation la plus naturelle et courante, avec l’orthographe de l’Académie tahitienne (ʻeta ʻ et macrons ā ē ī ō ū) quand tu en es sûr.\n- "prononciation" : pour un francophone, syllabes séparées par des tirets (u se lit « ou », e se lit « é »), par exemple « maa-ou-rou-ou-rou ».\n- "mot_a_mot" : chaque mot tahitien avec son sens en français (8 éléments au maximum).\n- "retour" : la retraduction littérale en français.\n- "note" : une astuce d’usage ou de culture en une phrase courte, ou "" si rien d’utile.\n- "certitude" : "haute", "moyenne" ou "faible". Sois honnête : si tu n’es pas sûr, ou si les Polynésiens disent plutôt cela en français, mets "moyenne" ou "faible" et explique-le dans "note".\n- Si le texte n’est pas une phrase à traduire, mets "tahitien": "" et explique-le dans "note".`;

  refreshTr();
  try {
    const prompt = `Propose 5 phrases très utiles et courtes en tahitien pour une famille française ${s.fr}.\n\nRéponds uniquement avec un tableau JSON, sans texte autour :\n[{"fr":"…","ty":"…","pr":"…"}]\n- "ty" : tahitien courant, orthographe de l’Académie tahitienne (ʻeta et macrons) quand tu en es sûr.\n- "pr" : la prononciation pour un francophone, syllabes avec tirets (u = « ou », e = « é »).\n- Des phrases simples qu’un enfant peut retenir. Évite celles que les Polynésiens diraient plutôt en français.`;
    const r = await S.sample.json(prompt, { modelTier: 'default' });
    const arr = (Array.isArray(r) ? r : (r && Array.isArray(r.phrases) ? r.phrases : [])).slice(0, 6).map(x => ({ fr: str(x && x.fr, 120), ty: str(x && x.ty, 120), pr: str(x && x.pr, 120) })).filter(x => x.fr && x.ty);
    if (!arr.length) throw { code: 'empty_completion' };
    tr.sRes = arr;
  } catch (e) { tr.sErr = sampleErr(e); }
  tr.sBusy = false; refreshTr();
}
function savePhrase(p) {
  const me = meMember();
  const id = uid('ph');
  Data.set('phrases', id, { ty: str(p.ty, 120), fr: str(p.fr, 120), pr: str(p.pr, 120), note: str(p.note, 300), from: str(p.from, 60), src: p.src || 'claude', who: me ? me.id : null, verified: !!p.verified, at: Date.now() });
  Lagoon.sync();
  return id;
}

/* ================================================================ Actions */
const ACT = {
  tab(el) { setTab(el.dataset.tab); },
  quickVaa() { setTab('jouer'); },
  openTribe() { openSheet('tribe', {}, true); },
  newMember() { S.ui.edit = null; openSheet('member', {}); setTimeout(() => { const i = $('#m-name'); if (i) i.focus(); }, 80); },
  editMember(el) { S.ui.edit = null; openSheet('member', { id: el.dataset.id }); },
  pickEmoji(el) { if (!S.ui.edit) return; S.ui.edit.emoji = el.dataset.e; document.querySelectorAll('#emoji-grid button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.e === el.dataset.e))); },
  pickLevel(el) { if (!S.ui.edit) return; S.ui.edit.level = el.dataset.lv; document.querySelectorAll('#level-chips .chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lv === el.dataset.lv))); },
  delMember(el) {
    const id = el.dataset.id;
    if (!el.dataset.armed) { el.dataset.armed = '1'; el.innerHTML = `${ico('trash')} Confirmer le retrait`; setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.innerHTML = `${ico('trash')} Retirer de la tribu`; } }, 4000); return; }
    Data.del('members', id);
    S.players = (S.players || []).filter(x => x !== id); Prefs.set('players', S.players);
    if (S.me === id) { S.me = null; Prefs.set('me', null); }
    closeSheet(); toast('Profil retiré de la tribu.'); scheduleRender();
  },
  setMe(el) { S.me = el.dataset.id; Prefs.set('me', S.me); renderSheet(); scheduleRender(); },
  toggleSound() { Sound.on = !Sound.on; Prefs.set('sound', Sound.on); if (Sound.on) Sound.pop(); renderSheet(); },
  closeSheet() { closeSheet(); },
  speak(el) { const w = wordById(el.dataset.id); if (w) TTS.speak(w.ty, w.pr); },
  speakText(el) { TTS.speak(el.dataset.text, el.dataset.pron); },
  openWord(el) { openSheet('word', { id: el.dataset.id }, true); },
  wordMark(el) {
    const id = el.dataset.id; const ok = el.dataset.ok === '1';
    const p = S.progress[id];
    if (ok && p && p.last && Date.now() - p.last < 20 * 60000) { toast('Déjà noté il y a peu : revenez réviser ce mot plus tard !'); return; }
    const me = meMember(); const born = bump(id, ok, me ? me.id : null);
    if (ok) Sound.good();
    toast(born ? 'Un nouveau poisson est né dans le lagon !' : ok ? 'Une perle de plus !' : 'Il reviendra bientôt dans les jeux.');
    markPracticed(); renderSheet(); scheduleRender();
  },
  wotdSaid(el) {
    const id = el.dataset.id; const k = todayKey() + ':' + id;
    if (Prefs.get('wotd', '') === k) return;
    Prefs.set('wotd', k); const me = meMember();
    const born = bump(id, true, me ? me.id : null); markPracticed(); Sound.good();
    toast(born ? 'Bravo ! Son poisson vient de naître.' : 'Maitaʻi roa ! Une perle de plus pour ce mot.');
    scheduleRender();
  },
  nextFact() { S.ui.fact = ((S.ui.fact || 0) + 1) % FACTS.length; renderView(); },
  setTheme(el) { S.ui.theme = el.dataset.th; renderView(); },
  setupGame(el) { const k = el.dataset.kind; if (k === 'vaa') startVaa(); else if (k === 'defi') startDefi(); else if (k === 'mem') startMem(); else startFc(); },
  togglePlayer(el) {
    const id = el.dataset.id; let ids = activePlayers().map(p => p.id).filter(x => x !== 'guest');
    if (ids.includes(id)) { if (ids.length === 1) { toast('Il faut au moins un joueur à bord !'); return; } ids = ids.filter(x => x !== id); } else ids.push(id);
    S.players = ids; Prefs.set('players', ids); renderView();
  },
  guestLevel(el) { S.guestLevel = el.dataset.lv; Prefs.set('guestLevel', S.guestLevel); renderView(); },
  setRoute(el) { S.ui.route = el.dataset.id; renderView(); },
  setVaaTheme(el) { S.ui.vaaTheme = el.dataset.th; document.querySelectorAll('[data-act="setVaaTheme"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.th === el.dataset.th))); },
  setDefi(el) { S.ui.defiMode = el.dataset.mode; renderView(); },
  setMem(el) { S.ui.memSize = Number(el.dataset.n) || 8; renderView(); },
  startVaa() { startVaa(); },
  startDefi() { startDefi(); },
  startMem() { startMem(); },
  startFc() { startFc(); },
  quitGame() { closeGame(); },
  answer(el) {
    if (!G || G.phase !== 'q' || !G.q.choices) return;
    const i = Number(el.dataset.i); G.picked = i;
    resolveAnswer(i === G.q.answer, false);
  },
  joker() {
    if (!G || G.kind !== 'vaa' || G.phase !== 'q' || G.pearls <= 0 || !G.q.choices) return;
    const wrong = G.q.choices.map((c, i) => i).filter(i => i !== G.q.answer && !G.removed.has(i));
    shuffle(wrong).slice(0, Math.max(1, wrong.length - 1)).forEach(i => G.removed.add(i));
    G.pearls--; Sound.pop(); renderVaa();
  },
  tile(el) {
    if (!G || G.phase !== 'q') return;
    const i = Number(el.dataset.i); if (G.built.includes(i)) return;
    G.built.push(i); Sound.tick();
    if (G.built.length === G.q.tiles.length) { const s = G.built.map(k => G.q.tiles[k].p).join(G.q.sep); G.typed = s; resolveAnswer(norm(s) === norm(G.q.target), false); }
    else rerenderGame();
  },
  tileUndo() { if (!G || G.phase !== 'q') return; G.built.pop(); rerenderGame(); },
  gNext() { if (!G) return; if (G.kind === 'vaa') vaaNext(); },
  defiGo() { defiGo(); },
  defiReveal() { if (G && G.kind === 'defi') { G.reveal = true; renderDefi(); } },
  defiMark(el) { if (G && G.kind === 'defi' && G.phase === 'play') defiMark(el.dataset.ok === '1'); },
  defiNextPlayer() { if (!G) return; G.turn++; G.phase = 'ready'; renderDefi(); },
  memFlip(el) { memFlip(Number(el.dataset.i)); },
  fcFlip() { if (!G || G.kind !== 'fc' || G.flipped) return; G.flipped = true; const el = $('#fc'); if (el) el.classList.add('flipped'); setTimeout(() => { if (G && G.kind === 'fc') renderFc(); }, 450); },
  fcMark(el) {
    if (!G || G.kind !== 'fc') return;
    const ok = el.dataset.ok === '1'; const w = G.list[G.i];
    if (ok) { G.known++; Sound.good(); }
    if (bump(w.id, ok, G.player ? G.player.id : null, !ok)) G.newFish.push(w);
    G.i++; G.flipped = false;
    if (G.i >= G.list.length) { markPracticed(); Sound.win(); if (G.known >= 7) flowers(16); }
    renderFc();
  },
  trDir(el) { S.ui.tr.dir = el.dataset.dir; S.ui.tr.res = null; S.ui.tr.err = ''; renderView(); },
  situation(el) { doSituation(el.dataset.k); },
  saveTr() {
    const r = S.ui.tr.res; if (!r) return;
    if (r.dir === 'fr') savePhrase({ ty: r.ty, fr: r.src, pr: r.pr, note: r.note, src: 'claude' });
    else savePhrase({ ty: r.src, fr: r.fr, pr: r.pr, note: r.note, src: 'claude' });
    S.phraseSaved = r.key; refreshTr(); toast('Ajoutée à nos phrases : elle rejoint les jeux !');
  },
  saveSit(el) {
    const p = S.ui.tr.sRes && S.ui.tr.sRes[Number(el.dataset.i)]; if (!p || p.saved) return;
    savePhrase({ ty: p.ty, fr: p.fr, pr: p.pr, src: 'claude' }); p.saved = true; refreshTr(); toast('Ajoutée à nos phrases !');
  },
  copy(el) {
    const text = el.dataset.text || '';
    const done = () => toast('Copié !');
    try { navigator.clipboard.writeText(text).then(done, () => toast('Copie impossible ici : sélectionnez le texte à la main.')); } catch (e) { toast('Copie impossible ici : sélectionnez le texte à la main.'); }
  },
  addPhrase() { openSheet('phrase', {}); setTimeout(() => { const i = $('#p-ty'); if (i) i.focus(); }, 80); },
  verifyPhrase(el) { const id = el.dataset.id; const p = S.phrases[id]; if (!p) return; Data.set('phrases', id, Object.assign({}, p, { verified: true })); toast('Validée par un Polynésien : māuruuru !'); renderSheet(); scheduleRender(); },
  delPhrase(el) {
    const id = el.dataset.id;
    if (!el.dataset.armed) { el.dataset.armed = '1'; el.innerHTML = `${ico('trash')} Confirmer la suppression`; setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.innerHTML = `${ico('trash')} Supprimer`; } }, 4000); return; }
    Data.del('phrases', id); Data.del('progress', 'p_' + id); closeSheet(); Lagoon.sync(); toast('Phrase supprimée.'); scheduleRender();
  },
  doneMission(el) { S.ui.edit = null; openSheet('mission', { id: el.dataset.id }); },
  toggleWho(el) { if (!S.ui.edit) return; const id = el.dataset.id; const s = S.ui.edit.who; if (s.has(id)) s.delete(id); else s.add(id); el.setAttribute('aria-pressed', String(s.has(id))); },
  confirmMission(el) {
    const id = el.dataset.id; const who = S.ui.edit && S.ui.edit.who ? Array.from(S.ui.edit.who) : [];
    Data.set('missions', id, { by: who, at: Date.now() }); markPracticed();
    const m = MISSIONS.find(x => x.id === id); if (m) { const me = meMember(); bump(m.w, true, who[0] || (me && me.id)); }
    closeSheet(); Lagoon.dirtyDecor(); Sound.win(); flowers(20); toast('Coquillage déposé au fond du lagon !'); scheduleRender();
  },
  undoMission(el) {
    if (!el.dataset.armed) { el.dataset.armed = '1'; el.textContent = 'Confirmer ?'; setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.textContent = 'Annuler'; } }, 4000); return; }
    Data.del('missions', el.dataset.id); Lagoon.dirtyDecor(); scheduleRender();
  }
};
function resolveAnswer(ok, almost) { if (!G) return; if (G.kind === 'vaa') vaaResolve(ok, almost); }
function rerenderGame() { if (G && G.kind === 'vaa') renderVaa(); }
function setTab(t) {
  if (!TABS.some(x => x[0] === t)) t = 'lagon';
  S.tab = t; closeSheet();
  try { if (location.hash !== '#' + t) history.replaceState(null, '', '#' + t); } catch (e) { /* hash bloqué */ }
  renderAll(); window.scrollTo(0, 0); Lagoon.toggle();
  if (t === 'lagon') setTimeout(() => Lagoon.resize(), 30);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  const fn = ACT[el.dataset.act]; if (fn) fn(el, e);
});
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (S.ui.sheet) closeSheet(); else if (S.ui.gameOpen) closeGame(); } });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.input === 'tr') { S.ui.tr.text = el.value; const m = $('#tr-matches'); if (m) m.innerHTML = matchesHTML(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.change === 'photo' && el.files && el.files[0]) { photoTranslate(el.files[0]); el.value = ''; }
});
document.addEventListener('submit', e => {
  const f = e.target; if (!f.dataset || !f.dataset.form) return;
  e.preventDefault();
  if (f.dataset.form === 'translate') { const ta = $('#tr-in'); if (ta) { S.ui.tr.text = ta.value; ta.blur(); } doTranslate(); }
  else if (f.dataset.form === 'member') {
    const id = f.dataset.id || uid('m'); const name = (f.elements.name.value || '').trim().slice(0, 24);
    if (!name) { toast('Il manque le prénom !'); return; }
    const old = S.members[id] || {}; const e2 = S.ui.edit || {};
    const m = { name, emoji: e2.emoji || old.emoji || '🐢', level: e2.level || old.level || 'moyen', color: old.color || COLORS[memberList().length % COLORS.length], createdAt: old.createdAt || Date.now(), ok: old.ok || 0, games: old.games || 0 };
    const isNew = !S.members[id];
    Data.set('members', id, m);
    if (isNew) { if (!S.me) { S.me = id; Prefs.set('me', id); } const cur = (S.players || []).filter(x => S.members[x]); if (cur.length) { cur.push(id); S.players = cur; Prefs.set('players', cur); } }
    S.ui.edit = null; openSheet('tribe', {}, true); toast(isNew ? `${m.emoji} ${m.name} rejoint la tribu !` : 'Profil enregistré.'); scheduleRender();
  } else if (f.dataset.form === 'phrase') {
    const tyv = (f.elements.ty.value || '').trim(), frv = (f.elements.fr.value || '').trim();
    if (!tyv || !frv) { toast('Il faut le tahitien et le français.'); return; }
    savePhrase({ ty: tyv, fr: frv, pr: (f.elements.pr.value || '').trim(), from: (f.elements.from.value || '').trim(), src: 'local', verified: true });
    closeSheet(); toast('Māuruuru ! Le mot rejoint nos phrases et les jeux.'); scheduleRender();
  } else if (f.dataset.form === 'typed') {
    if (!G || G.phase !== 'q') return;
    const v = f.elements.typed.value; const r = checkTyped(v, G.q.w);
    if (r === 'empty') { toast('Écris ta réponse d’abord !'); return; }
    G.typed = v; f.elements.typed.blur(); resolveAnswer(r !== 'ko', r === 'almost');
  }
});

/* ================================================================ Boot */
function start() {
  const h = (location.hash || '').replace('#', '');
  if (TABS.some(x => x[0] === h)) S.tab = h;
  TTS.init();
  Lagoon.init($('#lagoon'));
  renderAll(); Lagoon.toggle();
  Data.init();
  initSample();
}
start();
</script>
